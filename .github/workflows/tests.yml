name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          pip install PyYAML PyQt6 python-dotenv openai reportlab python-docx \
            loguru requests numpy matplotlib Pillow opencv-python-headless
      - name: Run unit tests (Mock / offline only)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest discover -s tests -p "test*.py"
